name: Propose a game
description: Suggest an abandoned or legacy game to rebuild for the web.
title: "[Project] "
labels: ["new project"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Please read the [ground rules](https://ai-rebuilds.com/contribute/#ground-rules) first.
        **Do not attach or link to copies of the game.**
  - type: input
    id: title
    attributes:
      label: Game title
    validations:
      required: true
  - type: input
    id: original
    attributes:
      label: Developer / publisher / year
      placeholder: Digital Chocolate, 2011
  - type: input
    id: platforms
    attributes:
      label: Original platform(s)
      placeholder: Windows, DOS, Android, Flash, Facebook…
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it need a rebuild?
      description: Delisted, servers shut down, platform gone, doesn't run on modern systems…
    validations:
      required: true
  - type: textarea
    id: rights
    attributes:
      label: What do you know about the rights status?
      description: Who owns it today, if anyone. "Unknown" is fine.
  - type: textarea
    id: technical
    attributes:
      label: Technical notes
      description: Engine, language, file formats, build versions you know of.
  - type: checkboxes
    id: commit
    attributes:
      label: Involvement
      options:
        - label: I own a copy of the original and can run analysis with REA
        - label: I'd like to maintain this project
