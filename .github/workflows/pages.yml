name: Build & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-files:
    name: No original game files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject binaries, archives and oversized files
        run: |
          set -euo pipefail
          pattern='\.(apk|xapk|aab|ipa|obb|exe|dll|msi|dmg|pkg|iso|bin|cue|img|rom|nes|sfc|smc|gb|gbc|gba|nds|n64|z64|swf|unity3d|assets|pak|wad|grp|dex|so|zip|7z|rar)$'
          bad=$(git ls-files | grep -iE "$pattern" || true)
          big=$(git ls-files -z | xargs -0 -I{} find {} -type f -size +5M || true)
          if [ -n "$bad$big" ]; then
            echo "::error::Original game files or oversized files found. See CONTRIBUTING.md#ground-rules."
            printf '%s\n' $bad $big
            exit 1
          fi
          echo "OK"

  build:
    name: Build site
    runs-on: ubuntu-latest
    needs: check-files
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Build (also validates project front matter)
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
