---
layout: default
---
<article class="wrap page">
  <header class="page-head">
    <h1>{{ page.title }}</h1>
    {%- if page.summary %}<p class="lede">{{ page.summary }}</p>{% endif %}
  </header>
  <div class="prose">{{ content }}</div>
  <p class="edit-link muted">
    <a href="https://github.com/{{ site.repository }}/edit/{{ site.branch }}/{{ page.source_file | default: page.path }}">Suggest an edit to this page</a>
  </p>
</article>
